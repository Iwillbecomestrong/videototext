[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-knowledge-extractor"
version = "0.1.0"
description = "Extract subtitles, correct domain terminology, and generate structured Markdown knowledge notes from technical videos."
authors = [{ name = "Iwillbecomestrong" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.12.23",
    "streamlit>=1.35.0",
    "openai>=1.30.0",
    "requests>=2.31.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
